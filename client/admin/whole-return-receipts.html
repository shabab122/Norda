<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="theme-color" content="#214c3b" /><title>Whole-order return receipts — Norda</title><link rel="icon" href="../assets/brand/norda-mark.png" /><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" /><link rel="stylesheet" href="../css/style.css" /><link rel="stylesheet" href="../css/branding.css" /><link rel="stylesheet" href="../css/management.css" /><link rel="stylesheet" href="../css/commerce-expansion.css" /><link rel="stylesheet" href="../css/admin.css" /></head><body><div class="admin-layout"><aside class="admin-sidebar" id="admin-sidebar"></aside><main class="admin-main"><div class="admin-topbar"><div><span class="eyebrow">Store operations</span><h1>Whole-order return receipts</h1></div><span id="admin-topbar-user"></span></div><div class="management-page"><p class="management-muted">Receive only the quantities that physically arrived. Restock inspected units at their actual receiving locations. Refunds release after complete receipt, using the policy saved with the request.</p><div id="management-alert" role="status" aria-live="polite"></div><section class="management-card"><h2>Policy for new return requests</h2><form id="return-rules-form"><div class="management-grid"><div class="field"><label for="return-fixed">Fixed merchandise deduction (BDT)</label><input id="return-fixed" type="number" required min="0" step="0.01" /></div><div class="field"><label for="return-percent">Merchandise deduction (%)</label><input id="return-percent" type="number" required min="0" max="100" step="0.01" /></div></div><label class="management-check"><input id="return-shipping" type="checkbox" />Credit the original delivery charge</label><div class="field"><label for="return-rules-note">Policy change note</label><input id="return-rules-note" type="text" required minlength="5" maxlength="1000" /></div><button class="btn btn-outline" type="submit">Save policy for future requests</button></form></section><section class="management-card"><form id="whole-return-find"><div class="management-actions"><label for="whole-return-id">Whole-order return request</label><input id="whole-return-id" list="whole-return-options" required pattern="[a-fA-F0-9]{24}" /><datalist id="whole-return-options"></datalist><button class="btn btn-outline" type="submit">Open return</button></div></form><div id="whole-return-summary"></div><form id="whole-return-receive" hidden><div id="whole-return-lines"></div><div class="field"><label for="whole-return-note">Inspection / receiving note</label><input id="whole-return-note" type="text" required minlength="5" maxlength="1000" /></div><label class="management-check"><input id="whole-return-confirmed" type="checkbox" required />These quantities were physically received and inspected.</label><button class="btn btn-primary" type="submit">Record received quantities</button></form></section><section class="management-card"><h2>Receipt history</h2><div id="whole-return-history"></div></section></div></main></div><script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/guest.js"></script><script src="../js/layout.js"></script><script src="../js/management-common.js"></script><script src="admin-layout.js"></script><script src="advanced-common.js"></script><script src="whole-return-receipts.js"></script></body></html>
