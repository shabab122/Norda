<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <meta name="theme-color" content="#214c3b" />
  <title>Manage Categories — Norda Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <main class="admin-main">
      <div class="admin-topbar">
        <div><span class="eyebrow">Catalog</span><h1>Categories</h1><p>Organize products into clear storefront collections.</p></div>
        <div class="admin-topbar-actions"><span id="admin-topbar-user"></span><button class="btn btn-primary btn-sm" id="new-category-btn">+ New category</button></div>
      </div>
      <div id="alert-box" aria-live="polite"></div>
      <div id="categories-root" class="admin-panel">
        <span class="spinner">Loading categories…</span>
      </div>
    </main>
  </div>

  <div class="modal-overlay hidden" id="category-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <h2 id="modal-title">New category</h2>
      <div id="modal-alert" aria-live="polite"></div>
      <form id="category-form">
        <input type="hidden" id="category-id" />
        <div class="field">
          <label for="category-name">Name</label>
          <input type="text" id="category-name" required />
        </div>
        <div class="field">
          <label for="category-image">Image URL (optional)</label>
          <input type="text" id="category-image" placeholder="https://..." />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline btn-sm" id="cancel-category-btn">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>
  <script src="admin-layout.js"></script>
  <script src="categories.js"></script>
</body>
</html>
