<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="theme-color" content="#214c3b" /><title>Email notifications — Norda Admin</title><link rel="icon" type="image/png" href="../assets/brand/norda-mark.png" /><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" /><link rel="stylesheet" href="../css/style.css" /><link rel="stylesheet" href="../css/management.css" /><link rel="stylesheet" href="../css/branding.css" /><link rel="stylesheet" href="../css/admin.css" /><link rel="stylesheet" href="../css/operations.css" /><link rel="stylesheet" href="../css/fulfillment.css" /></head>
<body><div class="admin-layout"><aside class="admin-sidebar" id="admin-sidebar"></aside><main class="admin-main"><div class="admin-topbar"><div><span class="eyebrow">Store operations</span><h1>Email notifications</h1><p>Follow order emails and retry delivery failures using your current email settings.</p></div><span id="admin-topbar-user"></span></div><div id="notification-config" class="operations-banner"></div><div class="admin-filters"><label for="notification-status">Delivery status</label><select id="notification-status"><option value="">All statuses</option><option value="queued">Queued</option><option value="sending">Sending</option><option value="sent">Sent</option><option value="failed">Failed</option><option value="held">Awaiting queue activation</option><option value="suppressed">Suppressed</option></select><button id="notification-refresh" class="btn btn-outline btn-sm" type="button">Refresh</button></div><div id="notification-alert" role="status" aria-live="polite"></div><section class="admin-panel" id="notification-list"><span class="spinner">Loading email delivery…</span></section><section class="admin-panel" id="delivery-outcome-root" hidden></section></main></div><script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/layout.js"></script><script src="admin-layout.js"></script><script src="notifications.js"></script><script src="../js/management-common.js"></script><script src="notification-delivery.js"></script></body></html>
