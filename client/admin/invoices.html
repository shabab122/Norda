<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="../assets/brand/norda-mark.png" />
  <meta name="theme-color" content="#214c3b" />
  <title>Invoices — Norda Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/branding.css" /><link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <main class="admin-main">
      <div class="admin-topbar">
        <div><span class="eyebrow">Billing</span><h1>Invoices</h1><p>Every order has one immutable pricing snapshot.</p></div>
        <div class="admin-topbar-actions"><span id="admin-topbar-user"></span><select id="payment-filter" aria-label="Filter invoices by payment"><option value="">All payment states</option><option value="pending">Pending</option><option value="paid">Paid</option><option value="failed">Failed</option><option value="cancelled">Cancelled</option><option value="review">Needs review</option></select></div>
      </div>
      <div class="admin-panel" id="invoices-root"><span class="spinner">Loading invoices…</span></div>
    </main>
  </div>
  <script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/layout.js"></script>
  <script src="admin-layout.js"></script><script src="invoices.js"></script>
</body>
</html>
