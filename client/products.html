<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Browse and filter the complete Norda product catalog." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <meta name="theme-color" content="#214c3b" />
  <title>Shop all products — Norda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="page-intro">
      <div class="container">
        <div class="breadcrumb"><a href="index.html">Home</a><span>/</span> Shop</div>
        <span class="eyebrow">The full collection</span>
        <h1 id="shop-title">Shop useful things</h1>
        <p>Filter by category, brand or price. Inventory and prices come directly from the store.</p>
      </div>
    </section>

    <section class="container shop-section">
      <div class="products-layout">
        <aside class="filters" id="catalog-filters" aria-label="Product filters">
          <div class="filter-heading">
            <h2>Filters</h2>
            <button type="button" class="text-button" id="clear-filters">Clear all</button>
          </div>

          <div class="filter-group">
            <h3>Categories</h3>
            <ul class="filters-list" id="filter-categories">
              <li><span class="spinner-inline">Loading…</span></li>
            </ul>
          </div>

          <div class="filter-group">
            <h3>Brands</h3>
            <ul class="filters-list" id="filter-brands">
              <li><span class="spinner-inline">Loading…</span></li>
            </ul>
          </div>

          <div class="filter-group">
            <h3>Price in BDT</h3>
            <form id="price-form">
              <div class="price-fields">
                <div class="field">
                  <label for="min-price">Minimum</label>
                  <input type="number" id="min-price" min="0" step="1" placeholder="0" />
                </div>
                <div class="field">
                  <label for="max-price">Maximum</label>
                  <input type="number" id="max-price" min="0" step="1" placeholder="20,000" />
                </div>
              </div>
              <div id="price-error" class="field-error" role="alert"></div>
              <button type="submit" class="btn btn-outline btn-sm btn-block">Apply price</button>
            </form>
          </div>
        </aside>

        <div class="catalog">
          <div class="toolbar">
            <button type="button" class="btn btn-outline btn-sm mobile-filter-button" id="filter-toggle" aria-controls="catalog-filters" aria-expanded="false">Filters</button>
            <span id="result-count" aria-live="polite">Loading products…</span>
            <label class="sort-control">
              <span>Sort</span>
              <select id="sort-select">
                <option value="newest">Newest first</option>
                <option value="price_asc">Price: low to high</option>
                <option value="price_desc">Price: high to low</option>
                <option value="top_rated">Top rated</option>
              </select>
            </label>
          </div>
          <div id="active-filters" class="active-filters"></div>
          <div id="product-grid" class="product-grid" aria-live="polite"></div>
          <nav id="pagination" class="pagination" aria-label="Product pages"></nav>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/products-render.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
